<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Süper Macera</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 420px;
            height: 100vh;
            max-height: 750px;
            background: linear-gradient(to bottom, #3a7bd5, #3a6073);
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            z-index: 10;
            display: none;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            padding: 0 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .d-pad {
            display: flex;
            gap: 15px;
        }
        .btn {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .btn-jump {
            width: 75px;
            height: 75px;
            background: rgba(231, 76, 60, 0.7);
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 999;
            text-align: center;
            padding: 20px;
        }
        .screen h1 {
            font-size: 36px;
            margin-bottom: 25px;
            color: #f1c40f;
        }

        .btn-main {
            width: 220px;
            padding: 15px;
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #2ecc71;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            z-index: 1000;
        }
        .btn-disabled {
            background: #475569 !important;
            color: #94a3b8 !important;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 25px;
        }
        .level-btn {
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
        }
        .level-active { background: #e67e22; color: white; }
        .level-locked { background: #1e293b; color: #475569; }

        #toast {
            position: absolute;
            bottom: 30px;
            background: #e74c3c;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            z-index: 2000;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="hud" id="hud">Altın: <span id="coin-count">0</span> / <span id="max-coins">0</span></div>
    <canvas id="canvas"></canvas>
    
    <div class="controls" id="controls">
        <div class="d-pad">
            <div class="btn" id="btn-left">◄</div>
            <div class="btn" id="btn-right">►</div>
        </div>
        <div class="btn btn-jump" id="btn-jump">▲</div>
    </div>

    <!-- 1. ANA MENÜ -->
    <div id="main-menu" class="screen">
        <h1>SÜPER MACERA</h1>
        <button class="btn-main" onclick="openLevelSelect()">BAŞLA</button>
        <button class="btn-main btn-disabled" onclick="showToast('Ayarlar yakında!')">AYARLAR</button>
    </div>

    <!-- 2. BÖLÜM SEÇME -->
    <div id="level-menu" class="screen" style="display: none;">
        <h2 style="margin-bottom: 20px;">Bölüm Seç</h2>
        <div class="level-grid" id="level-grid"></div>
        <button class="btn-main" style="width: 150px; background: #64748b;" onclick="openMainMenu()">Geri</button>
    </div>

    <!-- 3. GAME OVER -->
    <div id="game-over" class="screen" style="display: none;">
        <h1 style="color: #e74c3c;">ÖLDÜN!</h1>
        <button class="btn-main" onclick="restartGame()">Tekrar Oyna</button>
        <button class="btn-main" style="background: #64748b;" onclick="openMainMenu()">Ana Menü</button>
    </div>

    <!-- 4. KAZANMA -->
    <div id="win-screen" class="screen" style="display: none;">
        <h1 style="color: #2ecc71;">TEBRİKLER!</h1>
        <p id="coin-result-text" style="margin-bottom: 20px;"></p>
        <button class="btn-main" onclick="restartGame()">Tekrar Oyna</button>
        <button class="btn-main" style="background: #64748b;" onclick="openMainMenu()">Ana Menü</button>
    </div>

    <div id="toast"></div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const hud = document.getElementById('hud');
const controls = document.getElementById('controls');
const mainMenu = document.getElementById('main-menu');
const levelMenu = document.getElementById('level-menu');
const gameOverScreen = document.getElementById('game-over');
const winScreen = document.getElementById('win-screen');
const levelGrid = document.getElementById('level-grid');
const coinDisplay = document.getElementById('coin-count');
const maxCoinsDisplay = document.getElementById('max-coins');
const coinResultText = document.getElementById('coin-result-text');
const toast = document.getElementById('toast');

canvas.width = 420;
canvas.height = 750;

let coins = 0;
let isGameOver = false;
let isGameWon = false;
let isPlaying = false;
let cameraX = 0;

const keys = { left: false, right: false, jump: false };
const gravity = 0.55;

const player = { x: 50, y: 500, width: 30, height: 46, vx: 0, vy: 0, speed: 2.8, jumpPower: -11.8, grounded: false };

const platforms = [
    { x: 0, y: 640, width: 800, height: 110 },
    { x: 880, y: 640, width: 700, height: 110 },
    { x: 1640, y: 640, width: 600, height: 110 }
];

const blocks = [
    { x: 300, y: 500, width: 40, height: 40, hit: false, bounce: 0 },
    { x: 500, y: 500, width: 40, height: 40, hit: false, bounce: 0 }
];

let enemies = [
    { x: 1150, y: 605, width: 35, height: 35, vx: -0.8, minX: 950, maxX: 1350, alive: true }
];

const elevator = { x: 1950, y: 500, width: 70, height: 140, doorProgress: 0, isTriggered: false, timer: 0 };

maxCoinsDisplay.innerText = blocks.length;

// Doğrudan tıklama ve dokunma olayları (Basitleştirilmiş)
function setupButton(id, key) {
    const el = document.getElementById(id);
    if (!el) return;
    
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); keys[key] = true; });
    el.addEventListener('pointerup', (e) => { e.preventDefault(); keys[key] = false; });
    el.addEventListener('pointerleave', (e) => { e.preventDefault(); keys[key] = false; });
}

setupButton('btn-left', 'left');
setupButton('btn-right', 'right');
setupButton('btn-jump', 'jump');

function openMainMenu() {
    isPlaying = false;
    mainMenu.style.display = 'flex';
    levelMenu.style.display = 'none';
    gameOverScreen.style.display = 'none';
    winScreen.style.display = 'none';
    hud.style.display = 'none';
    controls.style.display = 'none';
}

function openLevelSelect() {
    mainMenu.style.display = 'none';
    levelMenu.style.display = 'flex';
    levelGrid.innerHTML = '';
    
    const btn = document.createElement('div');
    btn.classList.add('level-btn', 'level-active');
    btn.innerText = '1';
    btn.onclick = () => startLevel();
    levelGrid.appendChild(btn);
}

function startLevel() {
    levelMenu.style.display = 'none';
    hud.style.display = 'block';
    controls.style.display = 'flex';
    restartGame();
    isPlaying = true;
}

function restartGame() {
    isGameOver = false;
    isGameWon = false;
    coins = 0;
    coinDisplay.innerText = coins;
    player.x = 50; player.y = 500; player.vx = 0; player.vy = 0; cameraX = 0;
    blocks.forEach(b => { b.hit = false; b.bounce = 0; });
    enemies.forEach(e => { e.alive = true; e.x = 1150; });
    elevator.isTriggered = false; elevator.doorProgress = 0; elevator.timer = 0;
    gameOverScreen.style.display = 'none';
    winScreen.style.display = 'none';
    isPlaying = true;
}

function triggerGameOver() {
    isGameOver = true; isPlaying = false;
    gameOverScreen.style.display = 'flex';
}

function triggerWin() {
    isGameWon = true; isPlaying = false;
    winScreen.style.display = 'flex';
    coinResultText.innerText = `Toplanan Altın: ${coins} / ${blocks.length}`;
}

function showToast(msg) {
    toast.innerText = msg;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2000);
}

function update() {
    if (!isPlaying || isGameOver || isGameWon) return;

    if (keys.left) player.vx = -player.speed;
    else if (keys.right) player.vx = player.speed;
    else player.vx *= 0.65;

    player.vy += gravity;
    player.x += player.vx;
    player.y += player.vy;

    if (player.x - cameraX > 200) cameraX = player.x - 200;
    else if (player.x - cameraX < 80 && cameraX > 0) cameraX = player.x - 80;

    if (player.y > canvas.height + 100) triggerGameOver();

    player.grounded = false;
    platforms.forEach(p => {
        if (
            player.x + player.width > p.x && player.x < p.x + p.width &&
            player.y + player.height >= p.y && player.y + player.height <= p.y + 15 && player.vy >= 0
        ) {
            player.y = p.y - player.height;
            player.vy = 0;
            player.grounded = true;
        }
    });

    if (keys.jump && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
    }

    blocks.forEach(b => {
        if (
            player.x < b.x + b.width && player.x + player.width > b.x &&
            player.y < b.y + b.height && player.y + player.height > b.y
        ) {
            if (player.vy < 0) {
                player.vy = 2;
                if (!b.hit) {
                    b.hit = true;
                    b.bounce = -8;
                    coins++;
                    coinDisplay.innerText = coins;
                }
            } else if (player.vy > 0) {
                player.y = b.y - player.height;
                player.vy = 0;
                player.grounded = true;
            }
        }
    });

    enemies.forEach(e => {
        if (!e.alive) return;
        e.x += e.vx;
        if (e.x <= e.minX || e.x >= e.maxX) e.vx *= -1;

        if (
            player.x + player.width > e.x && player.x < e.x + e.width &&
            player.y + player.height > e.y && player.y < e.y + e.height
        ) {
            if (player.vy > 0) {
                e.alive = false;
                player.vy = -8;
            } else {
                triggerGameOver();
            }
        }
    });

    if (
        player.x + player.width > elevator.x && player.x < elevator.x + elevator.width &&
        player.y + player.height >= elevator.y
    ) {
        triggerWin();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Platformlar
    platforms.forEach(p => {
        ctx.fillStyle = '#5d4037';
        ctx.fillRect(p.x - cameraX, p.y, p.width, p.height);
        ctx.fillStyle = '#2e7d32';
        ctx.fillRect(p.x - cameraX, p.y, p.width, 6);
    });

    // Kutular
    blocks.forEach(b => {
        ctx.fillStyle = b.hit ? '#7f8c8d' : '#f1c40f';
        ctx.fillRect(b.x - cameraX, b.y + b.bounce, b.width, b.height);
        if (b.bounce < 0) b.bounce += 1;
    });

    // Düşman
    enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = '#ff4e50';
        ctx.beginPath();
        ctx.arc(e.x - cameraX + 17, e.y + 17, 17, 0, Math.PI * 2);
        ctx.fill();
    });

    // Asansör (Bitiş)
    ctx.fillStyle = '#34495e';
    ctx.fillRect(elevator.x - cameraX, elevator.y, elevator.width, elevator.height);

    // Oyuncu
    ctx.fillStyle = '#00c6ff';
    ctx.fillRect(player.x - cameraX, player.y, player.width, player.height);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

openMainMenu();
gameLoop();
</script>
</body>
</html>
