<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gerçekçi Mario - Dikey Oyun</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 420px;
            height: 100vh;
            max-height: 750px;
            background: linear-gradient(to bottom, #3a7bd5, #3a6073);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* UI Ve Kontroller */
        .hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .d-pad {
            display: flex;
            gap: 15px;
        }
        .btn {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            touch-action: manipulation;
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }
        .btn-jump {
            width: 75px;
            height: 75px;
            background: rgba(231, 76, 60, 0.6);
            border-color: rgba(255, 255, 255, 0.7);
        }
        .btn-jump:active {
            background: rgba(231, 76, 60, 0.9);
        }
        #game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
        }
        #game-over h1 { font-size: 36px; color: #e74c3c; margin-bottom: 10px; }
        #game-over button {
            padding: 12px 25px;
            font-size: 18px;
            background: #2ecc71;
            border: none;
            color: white;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="hud">Altın: <span id="coin-count">0</span></div>
    <canvas id="canvas"></canvas>
    
    <!-- Ekran Üstü Kontroller -->
    <div class="controls">
        <div class="d-pad">
            <div class="btn" id="btn-left">◄</div>
            <div class="btn" id="btn-right">►</div>
        </div>
        <div class="btn btn-jump" id="btn-jump">▲</div>
    </div>

    <!-- Game Over Ekranı -->
    <div id="game-over">
        <h1>ÖLDÜN!</h1>
        <p>Yaratığa değdin ve elendin.</p>
        <button onclick="restartGame()">Tekrar Dene</button>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const coinDisplay = document.getElementById('coin-count');
const gameOverScreen = document.getElementById('game-over');

// Ekran Boyutlandırma
canvas.width = 420;
canvas.height = 750;

// Oyun Durum Değişkenleri
let coins = 0;
let isGameOver = false;
let gameTime = 0;

// Girdi Yönetimi
const keys = { left: false, right: false, jump: false };

// --- Fiziksel Nesneler ---
const gravity = 0.55;

// Karakter (Yeşil-Mavi Renk Temalı, Hacimli ve Gölgeli)
const player = {
    x: 50,
    y: 500,
    width: 32,
    height: 48,
    vx: 0,
    vy: 0,
    speed: 4.5,
    jumpPower: -12.5,
    grounded: false
};

// Zemin
const groundY = 620;

// Bulutlar (Derinlik Efektli)
const clouds = [
    { x: 50, y: 80, scale: 0.8, speed: 0.2 },
    { x: 250, y: 150, scale: 1.2, speed: 0.4 },
    { x: 120, y: 280, scale: 0.6, speed: 0.15 }
];

// Gerçekçi Çimen Yaprakları Detayı
const grassBlades = [];
for (let i = 0; i < canvas.width; i += 3) {
    grassBlades.push({
        x: i,
        height: 12 + Math.random() * 10,
        angle: Math.random() * 0.2 - 0.1,
        speed: 0.05 + Math.random() * 0.05
    });
}

// Şans Blokları
const blocks = [
    { x: 80, y: 450, width: 40, height: 40, hit: false, bounce: 0 },
    { x: 180, y: 380, width: 40, height: 40, hit: false, bounce: 0 },
    { x: 280, y: 450, width: 40, height: 40, hit: false, bounce: 0 }
];

// Yaratık (Devriye Gezen Düşman)
const enemy = {
    x: 320,
    y: groundY - 35,
    width: 35,
    height: 35,
    vx: -1.5
};

// Efekt Parlamaları (Altın Çıkınca)
let particles = [];

// --- ÇİZİM FONKSİYONLARI ---

// Gerçekçi Güneş Çizimi
function drawSun() {
    ctx.save();
    let gradient = ctx.createRadialGradient(340, 70, 10, 340, 70, 80);
    gradient.addColorStop(0, 'rgba(255, 255, 220, 1)');
    gradient.addColorStop(0.2, 'rgba(255, 220, 100, 0.8)');
    gradient.addColorStop(1, 'rgba(255, 200, 50, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(340, 70, 80, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

// Animasyonlu Gerçekçi Bulutlar
function drawClouds() {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    clouds.forEach(c => {
        c.x += c.speed;
        if (c.x - 100 > canvas.width) c.x = -100;

        ctx.save();
        ctx.beginPath();
        ctx.arc(c.x, c.y, 20 * c.scale, 0, Math.PI * 2);
        ctx.arc(c.x + 25 * c.scale, c.y - 10 * c.scale, 25 * c.scale, 0, Math.PI * 2);
        ctx.arc(c.x + 50 * c.scale, c.y, 20 * c.scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
}

// Animasyonlu, Rüzgarda Sallanan Gerçekçi Çimenler
function drawGrass() {
    // Toprak Katmanı
    let earthGrad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
    earthGrad.addColorStop(0, '#5d4037');
    earthGrad.addColorStop(1, '#2d1b14');
    ctx.fillStyle = earthGrad;
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    // Çim Tabanı
    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(0, groundY - 4, canvas.width, 6);

    // Bireysel Çimen Yaprakları
    ctx.lineWidth = 2;
    grassBlades.forEach((blade) => {
        let wind = Math.sin(gameTime * blade.speed + blade.x) * 4;
        let tipX = blade.x + wind;
        let tipY = groundY - blade.height;

        let grad = ctx.createLinearGradient(blade.x, groundY, tipX, tipY);
        grad.addColorStop(0, '#1b5e20');
        grad.addColorStop(1, '#76ff03');

        ctx.strokeStyle = grad;
        ctx.beginPath();
        ctx.moveTo(blade.x, groundY);
        ctx.quadraticCurveTo(blade.x, groundY - blade.height / 2, tipX, tipY);
        ctx.stroke();
    });
}

// Yeşil-Mavi Gerçekçi Karakter
function drawPlayer() {
    ctx.save();
    
    // Gölge
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(player.x + player.width/2, groundY, player.width/2, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Gövde (Mavi Kıyafet / Yeşil Detay)
    let bodyGrad = ctx.createLinearGradient(player.x, player.y, player.x + player.width, player.y + player.height);
    bodyGrad.addColorStop(0, '#00c6ff'); // Mavi
    bodyGrad.addColorStop(1, '#0072ff');
    ctx.fillStyle = bodyGrad;
    ctx.fillRect(player.x + 4, player.y + 16, player.width - 8, player.height - 16);

    // Şapka/Kafa (Yeşil)
    let headGrad = ctx.createLinearGradient(player.x, player.y, player.x, player.y + 16);
    headGrad.addColorStop(0, '#11998e');
    headGrad.addColorStop(1, '#38ef7d'); // Canlı Yeşil
    ctx.fillStyle = headGrad;
    ctx.beginPath();
    ctx.arc(player.x + player.width/2, player.y + 12, 12, 0, Math.PI * 2);
    ctx.fill();

    // Gözler
    ctx.fillStyle = '#fff';
    ctx.fillRect(player.x + 18, player.y + 8, 4, 4);

    ctx.restore();
}

// Şans Blokları
function drawBlocks() {
    blocks.forEach(b => {
        ctx.save();
        let drawY = b.y + b.bounce;

        if (b.hit) {
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(b.x, drawY, b.width, b.height);
        } else {
            // Parlayan Şans Bloğu
            let grad = ctx.createLinearGradient(b.x, drawY, b.x + b.width, drawY + b.height);
            grad.addColorStop(0, '#f1c40f');
            grad.addColorStop(1, '#f39c12');
            ctx.fillStyle = grad;
            ctx.fillRect(b.x, drawY, b.width, b.height);

            // Soru İşareti
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 22px Arial';
            ctx.fillText('?', b.x + 14, drawY + 28);
        }

        // Derinlik/Çerçeve
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 3;
        ctx.strokeRect(b.x, drawY, b.width, b.height);

        ctx.restore();

        // Blok Zıplama Animasyonu
        if (b.bounce < 0) b.bounce += 1;
    });
}

// Yaratık
function drawEnemy() {
    ctx.save();
    // Kırmızı-Tehlikeli Dokulu Yaratık
    let grad = ctx.createRadialGradient(
        enemy.x + 15, enemy.y + 15, 5,
        enemy.x + 15, enemy.y + 15, 20
    );
    grad.addColorStop(0, '#ff4e50');
    grad.addColorStop(1, '#f9d423');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.width/2, 0, Math.PI * 2);
    ctx.fill();

    // Kızgın Gözler
    ctx.fillStyle = '#000';
    ctx.fillRect(enemy.x + 8, enemy.y + 10, 5, 5);
    ctx.fillRect(enemy.x + 20, enemy.y + 10, 5, 5);

    ctx.restore();
}

// Altın Efekt Partikülleri
function drawParticles() {
    particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.02;

        ctx.fillStyle = `rgba(241, 196, 15, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        if (p.alpha <= 0) particles.splice(index, 1);
    });
}

// --- FİZİK VE GÜNCELLEME ---

function update() {
    if (isGameOver) return;

    gameTime += 0.05;

    // Yatay Hareket
    if (keys.left) player.vx = -player.speed;
    else if (keys.right) player.vx = player.speed;
    else player.vx *= 0.8; // Sürtünme

    // Dikey Hareket / Yerçekimi
    player.vy += gravity;

    player.x += player.vx;
    player.y += player.vy;

    // Ekran Sınırları
    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

    // Zemin Etkileşimi
    if (player.y + player.height >= groundY) {
        player.y = groundY - player.height;
        player.vy = 0;
        player.grounded = true;
    } else {
        player.grounded = false;
    }

    // Zıplama
    if (keys.jump && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
    }

    // Blok Etkileşimleri (Aşağıdan Kafayla Vurma)
    blocks.forEach(b => {
        if (
            player.x < b.x + b.width &&
            player.x + player.width > b.x &&
            player.y < b.y + b.height &&
            player.y + player.height > b.y
        ) {
            // Aşağıdan kafa atma kontrolü
            if (player.vy < 0 && player.y > b.y + b.height - 12) {
                player.vy = 2; // Kafayı çarpınca aşağı sekme
                if (!b.hit) {
                    b.hit = true;
                    b.bounce = -8;
                    coins++;
                    coinDisplay.innerText = coins;
                    spawnParticles(b.x + b.width/2, b.y);
                }
            } else if (player.vy > 0 && player.y + player.height - player.vy <= b.y) {
                // Bloğun üstüne basma
                player.y = b.y - player.height;
                player.vy = 0;
                player.grounded = true;
            }
        }
    });

    // Yaratık Hareketi
    enemy.x += enemy.vx;
    if (enemy.x <= 10 || enemy.x + enemy.width >= canvas.width - 10) {
        enemy.vx *= -1; // Duvardan dön
    }

    // Yaratık ile Temas Kontrolü (Üstüne de basılsa, yanına da değilse ÖLÜM)
    if (
        player.x < enemy.x + enemy.width &&
        player.x + player.width > enemy.x &&
        player.y < enemy.y + enemy.height &&
        player.y + player.height > enemy.y
    ) {
        triggerGameOver();
    }
}

function spawnParticles(x, y) {
    for (let i = 0; i < 12; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6 - 2,
            size: 3 + Math.random() * 4,
            alpha: 1
        });
    }
}

function triggerGameOver() {
    isGameOver = true;
    gameOverScreen.style.display = 'flex';
}

function restartGame() {
    player.x = 50;
    player.y = 500;
    player.vx = 0;
    player.vy = 0;
    coins = 0;
    coinDisplay.innerText = coins;
    blocks.forEach(b => b.hit = false);
    isGameOver = false;
    gameOverScreen.style.display = 'none';
}

// Main Render Döngüsü
function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawSun();
    drawClouds();
    drawGrass();
    drawBlocks();
    drawEnemy();
    drawPlayer();
    drawParticles();

    update();

    requestAnimationFrame(loop);
}

// --- DOKUNMATİK VE KLAVYE KONTROLLERİ ---

function bindTouch(elementId, keyName) {
    const btn = document.getElementById(elementId);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
    btn.addEventListener('mousedown', () => { keys[keyName] = true; });
    btn.addEventListener('mouseup', () => { keys[keyName] = false; });
}

bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');
bindTouch('btn-jump', 'jump');

// PC Klavye Desteği (Yön Tuşları + Boşluk)
window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') keys.jump = true;
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') keys.jump = false;
});

// Oyunu Başlat
loop();
</script>
</body>
</html>
