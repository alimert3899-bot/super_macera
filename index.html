<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Süper Macera</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #3585c7;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #4a90e2, #50e3c2);
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            z-index: 10;
        }
        .platform {
            position: absolute;
            background-color: #4a4a4a;
            border-top: 4px solid #2e2e2e;
            border-radius: 4px;
        }
        #player {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #ff4757;
            border-radius: 4px;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
            z-index: 5;
        }
        .coin {
            position: absolute;
            width: 16px;
            height: 16px;
            background-color: #ffd700;
            border-radius: 50%;
            border: 2px solid #ffa500;
            z-index: 4;
        }
        .enemy {
            position: absolute;
            width: 26px;
            height: 26px;
            background-color: #d63031;
            border-radius: 4px;
            z-index: 4;
        }
        #door {
            position: absolute;
            width: 32px;
            height: 48px;
            background-color: #8e44ad;
            border: 3px solid #6c5ce7;
            border-radius: 4px 4px 0 0;
            z-index: 3;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 20;
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            touch-action: manipulation;
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div id="level-txt">Bölüm: 1</div>
        <div id="coin-txt">Altın: 0 / 5</div>
    </div>

    <div id="player"></div>
    <div id="door"></div>
    <div id="platforms-holder"></div>
    <div id="coins-holder"></div>
    <div id="enemies-holder"></div>

    <div class="controls">
        <div class="btn-group">
            <div class="btn" id="btn-left">◄</div>
            <div class="btn" id="btn-right">►</div>
        </div>
        <div class="btn" id="btn-jump">▲</div>
    </div>
</div>

<script>
// Ses Sentezleyicisi (Web Audio API)
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let bgmInterval = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new AudioContext();
        startBGM();
    } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

// Ses Efektleri
function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    
    if (type === 'hit') { // Düşman Ezme Sesi
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
    } 
    else if (type === 'die') { // Minecraft Tarzı Ölme Sesi
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.3);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
    } 
    else if (type === 'win') { // Zafer / Kutlama Melodisi (2 saniye)
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.12);
            gain.gain.setValueAtTime(0.2, now + idx * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.12);
            osc.stop(now + idx * 0.12 + 0.25);
        });
    }
    else if (type === 'coin') { // Altın Alma Sesi
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, now);
        osc.frequency.setValueAtTime(1318.51, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
    }
}

// Retro Arka Plan Müziği (Arka planda ritmik çalar)
function startBGM() {
    if (bgmInterval) return;
    const bgmNotes = [261.63, 293.66, 329.63, 349.23, 392.00, 329.63, 261.63, 196.00];
    let step = 0;
    bgmInterval = setInterval(() => {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(bgmNotes[step % bgmNotes.length], now);
        gain.gain.setValueAtTime(0.03, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
        step++;
    }, 220);
}

// Oyun Elemanları
const container = document.getElementById('game-container');
const playerEl = document.getElementById('player');
const doorEl = document.getElementById('door');
const platformsHolder = document.getElementById('platforms-holder');
const coinsHolder = document.getElementById('coins-holder');
const enemiesHolder = document.getElementById('enemies-holder');
const coinTxt = document.getElementById('coin-txt');
const levelTxt = document.getElementById('level-txt');

let currentLevel = 1;
let coinsCollected = 0;
let totalCoins = 0;

let player = {
    x: 50,
    y: 100,
    w: 30,
    h: 30,
    vx: 0,
    vy: 0,
    speed: 4,
    jumpPower: -11,
    grounded: false
};

const gravity = 0.5;
let keys = { left: false, right: false, jump: false };

// Bölümler (Aynı Görsel Tema, Farklı Parkur Yapısı)
const levels = {
    1: {
        door: { x: 280, y: 120 },
        platforms: [
            { x: 0, y: 550, w: 400, h: 50 },
            { x: 30, y: 450, w: 100, h: 15 },
            { x: 160, y: 360, w: 100, h: 15 },
            { x: 50, y: 270, w: 100, h: 15 },
            { x: 200, y: 170, w: 140, h: 15 }
        ],
        coins: [
            { x: 60, y: 410 },
            { x: 190, y: 320 },
            { x: 80, y: 230 },
            { x: 230, y: 130 },
            { x: 300, y: 130 }
        ],
        enemies: [
            { x: 170, y: 334, w: 26, h: 26, minX: 160, maxX: 230, speed: 1.5, dir: 1, alive: true }
        ]
    },
    2: { // Farklı Parkur Düzeni
        door: { x: 50, y: 100 },
        platforms: [
            { x: 0, y: 550, w: 400, h: 50 },
            { x: 220, y: 460, w: 120, h: 15 },
            { x: 80, y: 370, w: 100, h: 15 },
            { x: 220, y: 270, w: 120, h: 15 },
            { x: 30, y: 150, w: 120, h: 15 }
        ],
        coins: [
            { x: 250, y: 420 },
            { x: 110, y: 330 },
            { x: 260, y: 230 },
            { x: 80, y: 110 }
        ],
        enemies: [
            { x: 10, y: 524, w: 26, h: 26, minX: 10, maxX: 300, speed: 2, dir: 1, alive: true },
            { x: 230, y: 244, w: 26, h: 26, minX: 220, maxX: 310, speed: 1.5, dir: 1, alive: true }
        ]
    }
};

let currentPlatformData = [];
let currentCoinData = [];
let currentEnemyData = [];

function loadLevel(lvl) {
    currentLevel = lvl;
    const data = levels[lvl];
    if (!data) {
        playSound('win');
        alert("Tebrikler! Tüm bölümleri başardın!");
        loadLevel(1);
        return;
    }

    coinsCollected = 0;
    totalCoins = data.coins.length;
    levelTxt.innerText = "Bölüm: " + currentLevel;
    coinTxt.innerText = `Altın: ${coinsCollected} / ${totalCoins}`;

    player.x = 20;
    player.y = 480;
    player.vx = 0;
    player.vy = 0;

    doorEl.style.left = data.door.x + 'px';
    doorEl.style.top = data.door.y + 'px';

    // Platform Çizimi
    platformsHolder.innerHTML = '';
    currentPlatformData = data.platforms;
    currentPlatformData.forEach(p => {
        const div = document.createElement('div');
        div.className = 'platform';
        div.style.left = p.x + 'px';
        div.style.top = p.y + 'px';
        div.style.width = p.w + 'px';
        div.style.height = p.h + 'px';
        platformsHolder.appendChild(div);
    });

    // Altın Çizimi
    coinsHolder.innerHTML = '';
    currentCoinData = data.coins.map(c => {
        const div = document.createElement('div');
        div.className = 'coin';
        div.style.left = c.x + 'px';
        div.style.top = c.y + 'px';
        coinsHolder.appendChild(div);
        return { ...c, el: div, collected: false };
    });

    // Düşman Çizimi
    enemiesHolder.innerHTML = '';
    currentEnemyData = data.enemies.map(e => {
        const div = document.createElement('div');
        div.className = 'enemy';
        div.style.left = e.x + 'px';
        div.style.top = e.y + 'px';
        enemiesHolder.appendChild(div);
        return { ...e, el: div, alive: true };
    });
}

// Tuş İletişimi
const setupBtn = (id, key) => {
    const el = document.getElementById(id);
    const trigger = (e) => {
        e.preventDefault();
        initAudio();
        keys[key] = true;
    };
    const release = (e) => {
        e.preventDefault();
        keys[key] = false;
    };
    el.addEventListener('touchstart', trigger);
    el.addEventListener('touchend', release);
    el.addEventListener('mousedown', trigger);
    el.addEventListener('mouseup', release);
};
setupBtn('btn-left', 'left');
setupBtn('btn-right', 'right');
setupBtn('btn-jump', 'jump');

window.addEventListener('keydown', e => {
    initAudio();
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.jump = true;
});
window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.jump = false;
});

function update() {
    if (keys.left) player.vx = -player.speed;
    else if (keys.right) player.vx = player.speed;
    else player.vx = 0;

    if (keys.jump && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
    }

    player.vy += gravity;
    player.x += player.vx;
    player.y += player.vy;

    // Platform Çarpışması
    player.grounded = false;
    currentPlatformData.forEach(p => {
        if (player.x < p.x + p.w &&
            player.x + player.w > p.x &&
            player.y < p.y + p.h &&
            player.y + player.h > p.y) {
            
            if (player.vy > 0 && player.y + player.h - player.vy <= p.y + 10) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.grounded = true;
            }
        }
    });

    if (player.x < 0) player.x = 0;
    if (player.x + player.w > window.innerWidth) player.x = window.innerWidth - player.w;
    
    // Aşağı Düşüp Ölme
    if (player.y > window.innerHeight) {
        playSound('die');
        loadLevel(currentLevel);
    }

    // Düşman Mantığı (Üstüne basınca ezilme, yandan değince ölme)
    currentEnemyData.forEach(e => {
        if (!e.alive) return;

        e.x += e.speed * e.dir;
        if (e.x >= e.maxX || e.x <= e.minX) e.dir *= -1;
        e.el.style.left = e.x + 'px';

        // Temas Kontrolü
        if (player.x < e.x + e.w &&
            player.x + player.w > e.x &&
            player.y < e.y + e.h &&
            player.y + player.h > e.y) {

            // Üstüne zıplama kontrolü (Kafasına basma)
            if (player.vy > 0 && player.y + player.h - player.vy <= e.y + 12) {
                e.alive = false;
                e.el.style.display = 'none';
                player.vy = player.jumpPower * 0.7; // Zıplama sektirmesi
                playSound('hit');
            } else {
                // Yanlardan/alttan temas (Oyuncu ölür)
                playSound('die');
                loadLevel(currentLevel);
            }
        }
    });

    // Altın Toplama
    currentCoinData.forEach(c => {
        if (!c.collected &&
            player.x < c.x + 16 &&
            player.x + player.w > c.x &&
            player.y < c.y + 16 &&
            player.y + player.h > c.y) {
            c.collected = true;
            c.el.style.display = 'none';
            coinsCollected++;
            playSound('coin');
            coinTxt.innerText = `Altın: ${coinsCollected} / ${totalCoins}`;
        }
    });

    // Kapıya Ulaşma ve Bölüm Geçişi
    const doorX = parseInt(doorEl.style.left);
    const doorY = parseInt(doorEl.style.top);
    if (coinsCollected === totalCoins &&
        player.x < doorX + 32 &&
        player.x + player.w > doorX &&
        player.y < doorY + 48 &&
        player.y + player.h > doorY) {
        playSound('win');
        loadLevel(currentLevel + 1);
    }

    playerEl.style.left = player.x + 'px';
    playerEl.style.top = player.y + 'px';

    requestAnimationFrame(update);
}

loadLevel(1);
update();
</script>
</body>
</html>
