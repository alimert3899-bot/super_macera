<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Oyunu - Bölüm 1 & Bölüm 2</title>
    <style>
        body {
            margin: 0;
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            background: #555;
            border: 4px solid #fff;
        }
    </style>
</head>
<body>

    <h2 id="levelInfo">Bölüm 1</h2>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <p>Kontroller: Ok Tuşları (Sol / Sağ) ve Zıplamak için Boşluk (Space) tuşu.</p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const levelInfo = document.getElementById("levelInfo");

        let currentLevel = 1;
        let score = 0;

        let player = {
            x: 50,
            y: 250,
            width: 30,
            height: 30,
            vx: 0,
            vy: 0,
            speed: 4,
            jumpStrength: -10,
            gravity: 0.5,
            isJumping: false
        };

        let keys = {};
        window.addEventListener("keydown", e => keys[e.code] = true);
        window.addEventListener("keyup", e => keys[e.code] = false);

        let platforms = [];
        let flag = {};

        function loadLevel(level) {
            platforms = [];
            player.x = 50;
            player.y = 250;
            player.vx = 0;
            player.vy = 0;

            if (level === 1) {
                levelInfo.innerText = "Bölüm 1";
                // Zemin
                platforms.push({x: 0, y: 350, w: 800, h: 50, color: "#333"});
                // Platformlar
                platforms.push({x: 200, y: 270, w: 120, h: 20, color: "#777"});
                platforms.push({x: 400, y: 200, w: 120, h: 20, color: "#777"});
                platforms.push({x: 600, y: 130, w: 120, h: 20, color: "#777"});
                
                // Bayrak (Bitiş noktası)
                flag = {x: 700, y: 80, w: 20, h: 50};
            } else if (level === 2) {
                levelInfo.innerText = "Bölüm 2";
                // Zemin
                platforms.push({x: 0, y: 350, w: 900, h: 50, color: "#333"});
                // Bölüm 2 Parkurları
                platforms.push({x: 150, y: 280, w: 90, h: 20, color: "#888"});
                platforms.push({x: 300, y: 210, w: 90, h: 20, color: "#888"});
                platforms.push({x: 480, y: 150, w: 90, h: 20, color: "#888"});
                platforms.push({x: 650, y: 100, w: 90, h: 20, color: "#888"});

                // Bayrak
                flag = {x: 700, y: 50, w: 20, h: 50};
            }
        }

        loadLevel(currentLevel);

        function update() {
            if (keys["ArrowLeft"] || keys["KeyA"]) {
                player.vx = -player.speed;
            } else if (keys["ArrowRight"] || keys["KeyD"]) {
                player.vx = player.speed;
            } else {
                player.vx = 0;
            }

            if ((keys["ArrowUp"] || keys["Space"] || keys["KeyW"]) && !player.isJumping) {
                player.vy = player.jumpStrength;
                player.isJumping = true;
            }

            player.vy += player.gravity;
            player.x += player.vx;
            player.y += player.vy;

            // Platform Çarpışmaları
            player.isJumping = true;
            for (let p of platforms) {
                if (player.x < p.x + p.w && player.x + player.width > p.x &&
                    player.y + player.height > p.y && player.y + player.height - player.vy <= p.y) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.isJumping = false;
                }
            }

            // Ekran sınırları
            if (player.x < 0) player.x = 0;
            if (player.y > canvas.height) {
                loadLevel(currentLevel); // Düşerse baştan başlat
            }

            // Bayrağa Ulaşma Kontrolü
            if (player.x < flag.x + flag.w && player.x + player.width > flag.x &&
                player.y < flag.y + flag.h && player.y + player.height > flag.y) {
                if (currentLevel === 1) {
                    currentLevel = 2;
                    loadLevel(2);
                } else {
                    alert("Tebrikler! Oyunu başarıyla bitirdiniz!");
                    currentLevel = 1;
                    loadLevel(1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Platformları Çiz
            for (let p of platforms) {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.w, p.h);
            }

            // Bayrağı Çiz
            ctx.fillStyle = "yellow";
            ctx.fillRect(flag.x, flag.y, flag.w, flag.h);
            ctx.fillStyle = "red";
            ctx.fillRect(flag.x + flag.w, flag.y, 25, 20); // Bayrak bezi

            // Karakteri Çiz
            ctx.fillStyle = "cyan";
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
    </html>
