<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süper Macera - Bölüm 1 & Bölüm 2</title>
    <style>
        body {
            margin: 0;
            background: #2c3e50;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            background: #34495e;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            width: 800px;
            max-width: 100%;
            padding: 10px 20px;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            font-size: 24px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
            outline: none;
            font-weight: bold;
        }
        .ctrl-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
        #jumpBtn {
            background: rgba(231, 76, 60, 0.6);
            border-color: #e74c3c;
        }
    </style>
</head>
<body>

    <h2 id="info" style="margin: 5px;">Bölüm 1 - Başlangıç</h2>
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div class="controls">
        <div class="btn-group">
            <div class="ctrl-btn" id="leftBtn">&#9664;</div>
            <div class="ctrl-btn" id="rightBtn">&#9654;</div>
        </div>
        <div class="btn-group">
            <div class="ctrl-btn" id="jumpBtn">&#9650;</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const info = document.getElementById("info");

        let score = 0;
        let level = 1;

        let player = {
            x: 50,
            y: 300,
            width: 30,
            height: 45,
            vx: 0,
            vy: 0,
            speed: 5,
            jumpStrength: -11,
            gravity: 0.55,
            grounded: false
        };

        let keys = {};
        window.addEventListener("keydown", e => keys[e.code] = true);
        window.addEventListener("keyup", e => keys[e.code] = false);

        // Dokunmatik / Ekran Tuşları Kontrolü
        function setupBtn(id, actionOn, actionOff) {
            const btn = document.getElementById(id);
            btn.addEventListener("touchstart", (e) => { e.preventDefault(); actionOn(); });
            btn.addEventListener("touchend", (e) => { e.preventDefault(); actionOff(); });
            btn.addEventListener("mousedown", (e) => { e.preventDefault(); actionOn(); });
            btn.addEventListener("mouseup", (e) => { e.preventDefault(); actionOff(); });
        }

        setupBtn("leftBtn", () => player.vx = -player.speed, () => { if(player.vx < 0) player.vx = 0; });
        setupBtn("rightBtn", () => player.vx = player.speed, () => { if(player.vx > 0) player.vx = 0; });
        setupBtn("jumpBtn", () => { if (player.grounded) { player.vy = player.jumpStrength; player.grounded = false; } }, () => {});

        let platforms = [];
        let movingPlatforms = [];
        let hazards = [];
        let coins = [];
        let goal = {};

        function loadLevel(lvl) {
            platforms = [];
            movingPlatforms = [];
            hazards = [];
            coins = [];
            player.x = 50;
            player.y = 200;
            player.vx = 0;
            player.vy = 0;

            if (lvl === 1) {
                info.innerText = "Bölüm 1 - Temel Parkurlar";
                platforms.push({x: 0, y: 400, w: 1200, h: 50, color: "#2ecc71"});
                platforms.push({x: 300, y: 320, w: 140, h: 20});
                platforms.push({x: 500, y: 240, w: 140, h: 20});
                platforms.push({x: 750, y: 180, w: 180, h: 20});

                hazards.push({x: 450, y: 380, w: 50, h: 20});
                
                coins.push({x: 350, y: 280}, {x: 550, y: 200}, {x: 800, y: 140});
                goal = {x: 1100, y: 300, w: 40, h: 100};
            } else if (lvl === 2) {
                info.innerText = "Bölüm 2 - Gelişmiş Zorlu Parkurlar ve Hareketli Platformlar!";
                platforms.push({x: 0, y: 400, w: 1600, h: 50, color: "#34495e"});
                platforms.push({x: 200, y: 320, w: 100, h: 20});
                platforms.push({x: 400, y: 240, w: 100, h: 20});

                // Hareketli platformlar (Bölüm 2'nin ana zorluğu)
                movingPlatforms.push({x: 600, y: 240, w: 100, h: 20, minX: 550, maxX: 850, speed: 2});
                movingPlatforms.push({x: 950, y: 180, w: 100, h: 20, minX: 900, maxX: 1200, speed: 3});

                hazards.push({x: 320, y: 380, w: 80, h: 20});
                hazards.push({x: 750, y: 380, w: 120, h: 20});
                hazards.push({x: 1250, y: 380, w: 100, h: 20});

                coins.push({x: 230, y: 280}, {x: 430, y: 200}, {x: 700, y: 200}, {x: 1050, y: 140}, {x: 1400, y: 300});
                goal = {x: 1500, y: 300, w: 40, h: 100};
            }
        }

        loadLevel(level);

        function update() {
            if (keys["ArrowLeft"] || keys["KeyA"]) player.vx = -player.speed;
            else if (keys["ArrowRight"] || keys["KeyD"]) player.vx = player.speed;

            if ((keys["ArrowUp"] || keys["KeyW"] || keys["Space"]) && player.grounded) {
                player.vy = player.jumpStrength;
                player.grounded = false;
            }

            player.vy += player.gravity;
            player.x += player.vx;
            player.y += player.vy;

            player.grounded = false;

            let allPlats = [...platforms, ...movingPlatforms];
            for (let p of allPlats) {
                if (player.x < p.x + p.w && player.x + player.width > p.x &&
                    player.y < p.y + p.h && player.y + player.height > p.y) {
                    
                    if (player.vy > 0 && player.y + player.height - player.vy <= p.y + 10) {
                        player.y = p.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                        if (p.speed) {
                            player.x += p.speed * (p.dir || 1);
                        }
                    } else if (player.vy < 0 && player.y - player.vy >= p.y + p.h - 10) {
                        player.y = p.y + p.h;
                        player.vy = 0;
                    } else if (player.vx > 0) {
                        player.x = p.x - player.width;
                    } else if (player.vx < 0) {
                        player.x = p.x + p.w;
                    }
                }
            }

            for (let mp of movingPlatforms) {
                if (!mp.dir) mp.dir = 1;
                mp.x += mp.speed * mp.dir;
                if (mp.x < mp.minX || mp.x > mp.maxX) {
                    mp.dir *= -1;
                }
            }

            for (let h of hazards) {
                if (player.x < h.x + h.w && player.x + player.width > h.x &&
                    player.y < h.y + h.h && player.y + player.height > h.y) {
                    loadLevel(level);
                }
            }

            if (player.y > canvas.height) {
                loadLevel(level);
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                let c = coins[i];
                let dist = Math.hypot((player.x + player.width/2) - (c.x + 10), (player.y + player.height/2) - (c.y + 10));
                if (dist < 25) {
                    coins.splice(i, 1);
                    score += 10;
                }
            }

            if (player.x < goal.x + goal.w && player.x + player.width > goal.x &&
                player.y < goal.y + goal.h && player.y + player.height > goal.y) {
                if (level === 1) {
                    level = 2;
                    loadLevel(2);
                } else {
                    alert("Tebrikler! Oyunu Tamamladınız! Puanınız: " + score);
                    level = 1;
                    score = 0;
                    loadLevel(1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let cameraX = player.x - 200;
            if (cameraX < 0) cameraX = 0;

            ctx.save();
            ctx.translate(-cameraX, 0);

            for (let p of platforms) {
                ctx.fillStyle = p.color || "#7f8c8d";
                ctx.fillRect(p.x, p.y, p.w, p.h);
            }

            for (let mp of movingPlatforms) {
                ctx.fillStyle = "#9b59b6";
                ctx.fillRect(mp.x, mp.y, mp.w, mp.h);
            }

            for (let h of hazards) {
                ctx.fillStyle = "#e74c3c";
                ctx.fillRect(h.x, h.y, h.w, h.h);
            }

            for (let c of coins) {
                ctx.fillStyle = "#f1c40f";
                ctx.beginPath();
                ctx.arc(c.x + 10, c.y + 10, 10, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = "#f39c12";
            ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
            ctx.fillStyle = "#fff";
            ctx.font = "12px Arial";
            ctx.fillText("BİTİŞ", goal.x + 5, goal.y - 10);

            ctx.fillStyle = "#3498db";
            ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.restore();

            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            ctx.fillText("Puan: " + score, 20, 30);
            ctx.fillText("Bölüm: " + level, 700, 30);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loadLevel(1);
        loop();
    </script>
</body>
</html>
