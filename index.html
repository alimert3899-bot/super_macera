<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON SURVIVOR</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050611;color:white;
 font-family:Arial,sans-serif;overflow:hidden;touch-action:none
}
canvas{display:block;width:100vw;height:100dvh}
#hud{
 position:fixed;top:15px;left:15px;right:15px;
 display:flex;justify-content:space-between;pointer-events:none;
 font-weight:bold;text-shadow:0 0 12px #00eaff;font-size:14px
}
.pill{
 background:#10152bd9;border:1px solid #1e9bcb;
 padding:10px 13px;border-radius:12px
}
#overlay{
 position:fixed;inset:0;display:flex;align-items:center;
 justify-content:center;background:#03040bdc;z-index:5;
 padding:20px
}
.panel{
 width:min(400px,100%);padding:28px 22px;text-align:center;
 border:1px solid #00eaff;border-radius:24px;
 background:linear-gradient(145deg,#11172b,#070814);
 box-shadow:0 0 40px #007bff30
}
h1{font-size:clamp(32px,9vw,48px);margin:0 0 8px;
 color:#fff;text-shadow:0 0 15px #00eaff}
h1 span{color:#00eaff}
p{color:#b8c8e8;line-height:1.6;font-size:14px}
button{
 width:100%;padding:15px;margin-top:12px;border:0;
 border-radius:12px;background:#00eaff;color:#04101b;
 font-weight:900;font-size:16px;cursor:pointer
}
button.secondary{background:#202943;color:white;border:1px solid #455b82}
#hint{position:fixed;bottom:15px;width:100%;text-align:center;
 color:#8391b5;font-size:12px;pointer-events:none}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
 <div class="pill">⚡ <span id="score">0</span></div>
 <div class="pill">♥ <span id="hp">3</span></div>
 <div class="pill">🏆 <span id="best">0</span></div>
</div>

<div id="hint">HAREKET ET • ATEŞ OTOMATİK • MOR GÜÇLERİ TOPLA</div>

<div id="overlay">
 <div class="panel">
  <h1>NEON <span>SURVIVOR</span></h1>
  <p id="description">
   Neon arenaya hoş geldin!<br>
   Düşmanlardan kaç, otomatik ateşle ve rekorunu kır.<br><br>
   🟦 Mavi: Kalkan<br>
   🟣 Mor: Büyük patlama<br>
   🟡 Sarı: Can yenileme
  </p>
  <button id="start">OYUNA BAŞLA ▶</button>
  <button id="sound" class="secondary">🔊 SES: AÇIK</button>
 </div>
</div>

<script>
(() => {
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

let W=0,H=0,DPR=1;
let running=false,ended=false;
let score=0,best=Number(localStorage.getItem("neonBest")||0);
let hp=3,time=0,spawnTimer=0,shotTimer=0,powerTimer=0;
let enemies=[],bullets=[],particles=[],powers=[],stars=[];
let keys={},pointer=null,joy=null;
let shield=0,burst=0,shake=0,last=0;
let soundOn=true,audio=null;

$("best").textContent=best;

function resize(){
 DPR=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*DPR;canvas.height=H*DPR;
 ctx.setTransform(DPR,0,0,DPR,0,0);
 stars=Array.from({length:Math.floor(W*H/6500)},()=>({
  x:Math.random()*W,y:Math.random()*H,
  r:Math.random()*1.5+.3,a:Math.random()
 }));
}
addEventListener("resize",resize);resize();

const player={x:W/2,y:H*.72,r:12,speed:245,inv:0};
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function tone(freq=440,duration=.07,type="sine"){
 if(!soundOn)return;
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  const o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(.055,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
  o.connect(g);g.connect(audio.destination);
  o.start();o.stop(audio.currentTime+duration);
 }catch(e){}
}

function burstFX(x,y,color,n=16){
 for(let i=0;i<n;i++){
  const a=Math.random()*Math.PI*2,s=rand(45,260);
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
   life:rand(.25,.65),max:.65,r:rand(1,4),color});
 }
}

function reset(){
 score=0;hp=3;time=0;spawnTimer=.5;shotTimer=.1;powerTimer=8;
 enemies=[];bullets=[];particles=[];powers=[];
 shield=0;burst=0;shake=0;
 player.x=W/2;player.y=H*.72;player.inv=1.5;
 keys={};joy=null;pointer=null;
 ended=false;running=true;
 $("overlay").classList.add("hidden");
 $("score").textContent=0;$("hp").textContent=hp;
}

function spawnEnemy(){
 const edge=Math.floor(Math.random()*4);
 let x,y;
 if(edge===0){x=rand(0,W);y=-25}
 else if(edge===1){x=W+25;y=rand(0,H)}
 else if(edge===2){x=rand(0,W);y=H+25}
 else{x=-25;y=rand(0,H)}
 const difficulty=Math.min(time/90,1.5);
 const roll=Math.random();
 let type="normal";
 if(time>12&&roll<.23)type="fast";
 else if(time>25&&roll>.77)type="tank";
 enemies.push({
  x,y,r:type==="tank"?19:type==="fast"?9:13,
  speed:(type==="fast"?135:type==="tank"?43:67)+difficulty*18,
  hp:type==="tank"?3:1,type,
  phase:Math.random()*6.28
 });
}

function nearestEnemy(){
 let bestE=null,bestD=Infinity;
 for(const e of enemies){
  const d=(e.x-player.x)**2+(e.y-player.y)**2;
  if(d<bestD){bestD=d;bestE=e}
 }
 return bestE;
}

function shoot(){
 const e=nearestEnemy();
 if(!e)return;
 const a=Math.atan2(e.y-player.y,e.x-player.x);
 bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*510,
  vy:Math.sin(a)*510,r:4,life:1.3});
 tone(620,.035,"triangle");
}

function spawnPower(){
 const r=Math.random();
 powers.push({
  x:rand(30,W-30),y:rand(75,H-35),r:12,
  type:r<.4?"shield":r<.72?"burst":"heal",
  life:10,phase:0
 });
}

function collect(p){
 if(p.type==="shield"){shield=6;burstFX(p.x,p.y,"#00eaff",22)}
 if(p.type==="burst"){
  burstFX(p.x,p.y,"#c04bff",65);
  enemies.forEach(e=>{score+=10;burstFX(e.x,e.y,"#c04bff",7)});
  enemies=[];
  tone(100,.35,"sawtooth");
 }
 if(p.type==="heal"){
  hp=Math.min(5,hp+1);
  burstFX(p.x,p.y,"#ffe66d",22);
 }
 tone(850,.1);
}

function damage(e){
 if(player.inv>0||shield>0)return;
 hp--;player.inv=1.25;shake=9;
 tone(120,.18,"sawtooth");
 burstFX(player.x,player.y,"#ff3155",24);
 if(hp<=0)gameOver();
 $("hp").textContent=hp;
}

function gameOver(){
 running=false;ended=true;
 best=Math.max(best,score);
 localStorage.setItem("neonBest",best);
 $("best").textContent=best;
 $("description").innerHTML=
  `ARENA BİTTİ!<br><br>Skorun: <b style="color:#00eaff">${score}</b><br>`+
  `En iyi skor: <b style="color:#ffe66d">${best}</b><br><br>`+
  `Bir tur daha oynayıp rekorunu kır!`;
 $("start").textContent="TEKRAR OYNA ↻";
 $("overlay").classList.remove("hidden");
}

function update(dt){
 time+=dt;
 score+=Math.floor(dt*2);
 $("score").textContent=score;
 shield=Math.max(0,shield-dt);
 player.inv=Math.max(0,player.inv-dt);
 shake=Math.max(0,shake-dt*22);
 spawnTimer-=dt;shotTimer-=dt;powerTimer-=dt;

 if(spawnTimer<=0){
  spawnEnemy();
  spawnTimer=Math.max(.24,1.05-time*.008);
 }
 if(shotTimer<=0){shoot();shotTimer=.27}
 if(powerTimer<=0){spawnPower();powerTimer=rand(9,14)}

 let dx=0,dy=0;
 if(keys.ArrowLeft||keys.a||keys.A)dx--;
 if(keys.ArrowRight||keys.d||keys.D)dx++;
 if(keys.ArrowUp||keys.w||keys.W)dy--;
 if(keys.ArrowDown||keys.s||keys.S)dy++;

 if(joy){
  dx+=joy.dx;dy+=joy.dy;
 }
 const mag=Math.hypot(dx,dy);
 if(mag>0){dx/=mag;dy/=mag}
 player.x=clamp(player.x+dx*player.speed*dt,18,W-18);
 player.y=clamp(player.y+dy*player.speed*dt,65,H-20);

 for(const e of enemies){
  e.phase+=dt*4;
  const a=Math.atan2(player.y-e.y,player.x-e.x);
  e.x+=Math.cos(a)*e.speed*dt;
  e.y+=Math.sin(a)*e.speed*dt;
  if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){
   damage(e);
   if(e.type!=="tank"||player.inv>0){
    if(player.inv>0||shield>0){
     // Hasar görmezken çarpışma da düşmanı uzaklaştırır.
     const push=Math.atan2(e.y-player.y,e.x-player.x);
     e.x+=Math.cos(push)*35;e.y+=Math.sin(push)*35;
    }
   }
  }
 }

 for(const b of bullets){
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  for(const e of enemies){
   if(e.hp>0&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
    e.hp--;b.life=0;
    burstFX(b.x,b.y,"#00eaff",4);
    if(e.hp<=0){
     score+=e.type==="tank"?35:e.type==="fast"?18:12;
     burstFX(e.x,e.y,e.type==="tank"?"#ff7a35":"#ff3155",12);
     tone(260,.06,"triangle");
    }
    break;
   }
  }
 }
 bullets=bullets.filter(b=>b.life>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
 enemies=enemies.filter(e=>e.hp>0&&e.x>-70&&e.x<W+70&&e.y>-70&&e.y<H+70);

 for(const p of powers){
  p.life-=dt;p.phase+=dt*4;
  if(Math.hypot(player.x-p.x,player.y-p.y)<player.r+p.r+4){
   collect(p);p.life=0;
  }
 }
 powers=powers.filter(p=>p.life>0);

 for(const p of particles){
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.vx*=Math.pow(.04,dt);p.vy*=Math.pow(.04,dt);
  p.life-=dt;
 }
 particles=particles.filter(p=>p.life>0);
}

function glow(color,blur=12){
 ctx.shadowColor=color;ctx.shadowBlur=blur;
}

function draw(){
 ctx.save();
 if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));
 ctx.fillStyle="#050611";ctx.fillRect(-20,-20,W+40,H+40);

 // Neon yıldızlar
 for(const s of stars){
  ctx.globalAlpha=.25+.65*(.5+.5*Math.sin(time+s.a*8));
  ctx.fillStyle="#9bbdff";
  ctx.fillRect(s.x,s.y,s.r,s.r);
 }
 ctx.globalAlpha=1;

 // Arenanın arka plan ızgarası
 ctx.strokeStyle="#18203c";ctx.lineWidth=1;
 const grid=44,offset=(time*12)%grid;
 for(let x=0;x<W;x+=grid){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
 }
 for(let y=-grid+offset;y<H;y+=grid){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
 }

 // Güçlendirmeler
 for(const p of powers){
  const color=p.type==="shield"?"#00eaff":p.type==="burst"?"#c04bff":"#ffe66d";
  ctx.save();ctx.translate(p.x,p.y);
  ctx.rotate(p.phase);
  glow(color,18);
  ctx.strokeStyle=color;ctx.lineWidth=2;
  ctx.beginPath();ctx.rect(-p.r,-p.r,p.r*2,p.r*2);ctx.stroke();
  ctx.rotate(-p.phase*2);
  ctx.fillStyle=color;ctx.font="bold 14px Arial";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(p.type==="shield"?"S":p.type==="burst"?"✦":"+",0,0);
  ctx.restore();
 }
 ctx.shadowBlur=0;

 // Düşmanlar
 for(const e of enemies){
  const color=e.type==="tank"?"#ff7a35":e.type==="fast"?"#ff2b7a":"#ff3155";
  glow(color,15);
  ctx.fillStyle=color;ctx.strokeStyle="#ffd5e1";ctx.lineWidth=1;
  ctx.beginPath();
  if(e.type==="tank"){
   ctx.save();ctx.translate(e.x,e.y);ctx.rotate(time);
   ctx.rect(-e.r,-e.r,e.r*2,e.r*2);ctx.fill();ctx.stroke();
   ctx.restore();
  }else{
   ctx.beginPath();
   for(let i=0;i<6;i++){
    const a=i*Math.PI/3+time*(e.type==="fast"?2:.4);
    const x=e.x+Math.cos(a)*e.r,y=e.y+Math.sin(a)*e.r;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
   }
   ctx.closePath();ctx.fill();ctx.stroke();
  }
  ctx.shadowBlur=0;
 }

 // Mermiler
 for(const b of bullets){
  glow("#00eaff",15);ctx.fillStyle="#b8ffff";
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
 }
 ctx.shadowBlur=0;

 // Parçacıklar
 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life/p.max);
  glow(p.color,8);ctx.fillStyle=p.color;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;ctx.shadowBlur=0;

 // Oyuncu: neon uzay gemisi
 ctx.save();ctx.translate(player.x,player.y);
 const target=nearestEnemy();
 if(target)ctx.rotate(Math.atan2(target.y-player.y,target.x-player.x)+Math.PI/2);
 if(player.inv>0&&Math.floor(time*14)%2===0)ctx.globalAlpha=.35;
 glow("#00eaff",22);
 ctx.fillStyle="#d5ffff";ctx.strokeStyle="#00eaff";ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(12,12);
 ctx.lineTo(0,7);ctx.lineTo(-12,12);ctx.closePath();ctx.fill();ctx.stroke();

 // Motor ışığı
 ctx.fillStyle="#ff45dd";
 ctx.beginPath();ctx.moveTo(-4,9);ctx.lineTo(0,rand(15,24));
 ctx.lineTo(4,9);ctx.closePath();ctx.fill();
 ctx.restore();ctx.globalAlpha=1;ctx.shadowBlur=0;

 if(shield>0){
  ctx.strokeStyle="#00eaff";ctx.lineWidth=2;
  glow("#00eaff",18);
  ctx.beginPath();ctx.arc(player.x,player.y,25+Math.sin(time*8)*2,0,Math.PI*2);ctx.stroke();
  ctx.shadowBlur=0;
 }

 ctx.restore();
}

function loop(ts){
 const dt=Math.min((ts-last)/1000||0,.035);last=ts;
 if(running)update(dt);
 else time+=dt*.25;
 draw();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

$("start").addEventListener("click",()=>{
 tone(500,.1);reset();
});
$("sound").addEventListener("click",()=>{
 soundOn=!soundOn;
 $("sound").textContent=soundOn?"🔊 SES: AÇIK":"🔇 SES: KAPALI";
});

addEventListener("keydown",e=>{
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
 keys[e.key]=true;
});
addEventListener("keyup",e=>keys[e.key]=false);

function pos(e){return{x:e.clientX,y:e.clientY}}
canvas.addEventListener("pointerdown",e=>{
 if(!running)return;
 pointer=pos(e);
 joy={dx:0,dy:0};
 canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove",e=>{
 if(!pointer||!joy)return;
 const p=pos(e),dx=p.x-pointer.x,dy=p.y-pointer.y;
 const d=Math.hypot(dx,dy),max=65;
 joy.dx=dx/Math.max(max,d);
 joy.dy=dy/Math.max(max,d);
});
function release(){
 pointer=null;joy=null;
}
canvas.addEventListener("pointerup",release);
canvas.addEventListener("pointercancel",release);
})();
</script>
</body>
   </html>
