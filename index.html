<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TINY ISLAND | Survival</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#102b2a;color:white;font-family:Arial;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated}
#top{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:6px;justify-content:space-between;pointer-events:none}
.box{background:#101b22ed;border:1px solid #476a70;border-radius:12px;padding:9px;font-size:12px;font-weight:bold}
#stats{position:fixed;top:62px;left:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:95%}
#menu{position:fixed;inset:0;background:#071619eF;display:flex;align-items:center;justify-content:center;padding:20px}
.panel{background:#142b30;border:1px solid #4a9b83;border-radius:22px;padding:28px 22px;text-align:center;width:min(390px,100%);box-shadow:0 0 40px #0008}
h1{font-size:37px;margin:0;color:#9fffc2}
p{color:#d0e1d8;line-height:1.6;font-size:14px}
button{border:0;border-radius:12px;background:#9fffc2;color:#10352a;font-weight:bold;font-size:15px;padding:13px;cursor:pointer}
#start{width:100%;margin-top:10px}
#actions{position:fixed;bottom:20px;right:15px;display:flex;flex-direction:column;gap:9px}
.action{width:100px;background:#152c32ed;border:1px solid #81dcb0;color:white}
#hint{position:fixed;bottom:14px;left:10px;color:#e0f4df;font-size:11px;max-width:45%;line-height:1.5;pointer-events:none}
#toast{position:fixed;top:115px;left:50%;transform:translateX(-50%);background:#142b30ee;border:1px solid #9fffc2;border-radius:12px;padding:10px 14px;display:none;font-size:13px;white-space:nowrap}
#joystick{position:fixed;left:22px;bottom:38px;width:125px;height:125px;border-radius:50%;background:#c4ffe322;border:2px solid #c4ffe255;touch-action:none}
#knob{position:absolute;width:47px;height:47px;border-radius:50%;background:#9fffc2aa;border:2px solid #eaffee;left:37px;top:37px}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="top">
 <div class="box">🌲 TINY ISLAND</div>
 <div class="box">❤️ <span id="hp">100</span></div>
 <div class="box">🍗 <span id="food">100</span></div>
</div>
<div id="stats">
 <div class="box">🪵 <span id="wood">0</span></div>
 <div class="box">🪨 <span id="stone">0</span></div>
 <div class="box">🫐 <span id="berry">0</span></div>
</div>
<div id="toast"></div>
<div id="joystick" class="hidden"><div id="knob"></div></div>
<div id="actions" class="hidden">
 <button class="action" id="gather">⛏️ TOPLA</button>
 <button class="action" id="eat">🫐 YE</button>
 <button class="action" id="build">🏠 EV YAP</button>
</div>
<div id="hint" class="hidden">Yürü • Kaynak topla<br>Odun ve taşla ev inşa et!</div>
<div id="menu">
 <div class="panel">
  <h1>🌿 TINY ISLAND</h1>
  <p>Küçük bir adada yeni bir hayata başla!<br><br>
  🌲 Ağaçlardan odun topla.<br>
  🪨 Kayalardan taş çıkar.<br>
  🫐 Meyve yiyerek enerjini koru.<br>
  🏠 Kendi evini inşa et.<br><br>
  <b>Amacın: Hayatta kal ve adanı geliştir!</b></p>
  <button id="start">MACERAYA BAŞLA ▶</button>
 </div>
</div>
<script>
(()=>{
const c=document.getElementById('world'),ctx=c.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,dpr,playing=false,last=0,elapsed=0;
let camera={x:0,y:0};
let wood=0,stone=0,berry=0,hp=100,food=100;
let messageTimer=0,world=[],particles=[],keys={},buildings=[];
let joystick={x:0,y:0},joyTouch=null;
const TILE=48;
const player={x:0,y:0,speed:185,dir:0,anim:0};
const rnd=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 c.width=W*dpr;c.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);resize();

function toast(t){
 $('toast').textContent=t;$('toast').style.display='block';
 messageTimer=2;
}
function updateUI(){
 $('wood').textContent=wood;$('stone').textContent=stone;
 $('berry').textContent=berry;$('hp').textContent=Math.ceil(hp);
 $('food').textContent=Math.ceil(food);
}
function start(){
 playing=true;elapsed=0;
 wood=0;stone=0;berry=0;hp=100;food=100;
 particles=[];buildings=[];world=[];
 player.x=0;player.y=0;
 // Başlangıç kampı çevresinde kaynaklar oluştur.
 for(let x=-12;x<=12;x++){
  for(let y=-12;y<=12;y++){
   if(Math.abs(x)<2&&Math.abs(y)<2)continue;
   const r=Math.random();
   if(r<.105)world.push({x:x*TILE*1.8,y:y*TILE*1.8,type:'tree',amount:3});
   else if(r<.15)world.push({x:x*TILE*1.8,y:y*TILE*1.8,type:'rock',amount:3});
   else if(r<.19)world.push({x:x*TILE*1.8,y:y*TILE*1.8,type:'berry',amount:2});
  }
 }
 $('menu').classList.add('hidden');
 ['joystick','actions','hint'].forEach(id=>$(id).classList.remove('hidden'));
 updateUI();toast('Adana hoş geldin! Kaynak toplamaya başla.');
}
$('start').onclick=start;

function screenX(x){return x-camera.x+W/2}
function screenY(y){return y-camera.y+H/2}

function circle(x,y,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}

function drawTree(x,y){
 // Ağaç gölgesi
 circle(x+4,y+12,19,'#173e2a');
 ctx.fillStyle='#74513a';ctx.fillRect(x-5,y-4,10,25);
 circle(x,y-15,22,'#23653b');
 circle(x-12,y-10,14,'#2d7944');
 circle(x+11,y-18,15,'#32864a');
 circle(x-5,y-23,13,'#3d9853');
}
function drawRock(x,y){
 circle(x+3,y+9,17,'#243b38');
 ctx.fillStyle='#788b86';
 ctx.beginPath();ctx.moveTo(x-18,y+5);ctx.lineTo(x-10,y-11);
 ctx.lineTo(x+3,y-17);ctx.lineTo(x+18,y-4);
 ctx.lineTo(x+15,y+10);ctx.lineTo(x-10,y+14);
 ctx.closePath();ctx.fill();
 circle(x-5,y-5,4,'#a8bcb3');
}
function drawBerry(x,y){
 circle(x,y+8,12,'#256d39');
 circle(x-5,y-2,5,'#e65a9c');circle(x+5,y-4,5,'#ff77af');
 circle(x,y-8,5,'#ff9ac2');
}
function drawPlayer(){
 const x=screenX(player.x),y=screenY(player.y);
 // Gölge
 ctx.fillStyle='#142d2799';ctx.beginPath();
 ctx.ellipse(x,y+11,13,6,0,0,Math.PI*2);ctx.fill();
 // Kafa ve saç
 ctx.fillStyle='#eab18b';ctx.fillRect(x-8,y-17,16,15);
 ctx.fillStyle='#49342c';ctx.fillRect(x-9,y-21,18,8);
 ctx.fillRect(x-9,y-15,4,8);
 // Gövde
 ctx.fillStyle='#327ca0';ctx.fillRect(x-10,y-3,20,19);
 ctx.fillStyle='#e3c49a';ctx.fillRect(x-9,y+15,7,9);
 ctx.fillRect(x+2,y+15,7,9);
 ctx.fillStyle='#d8b090';ctx.fillRect(x-14,y,5,12);
 ctx.fillRect(x+9,y,5,12);
 // Sırt çantası
 ctx.fillStyle='#ad7440';ctx.fillRect(x-14,y-1,5,13);
}

function drawCabin(x,y){
 ctx.fillStyle='#69452d';ctx.fillRect(x-30,y-17,60,43);
 ctx.fillStyle='#ba8150';ctx.beginPath();
 ctx.moveTo(x-38,y-17);ctx.lineTo(x,y-44);
 ctx.lineTo(x+38,y-17);ctx.closePath();ctx.fill();
 ctx.fillStyle='#e5ba6e';ctx.fillRect(x-22,y-10,12,13);
 ctx.fillRect(x+10,y-10,12,13);
 ctx.fillStyle='#302d35';ctx.fillRect(x-6,y+3,13,23);
 ctx.fillStyle='#ffc85d';ctx.fillRect(x+1,y+12,3,3);
}

function draw(){
 ctx.fillStyle='#37764b';ctx.fillRect(0,0,W,H);
 // Toprak desenleri ve çimenler
 for(let x=0;x<W;x+=36){
  for(let y=0;y<H;y+=36){
   const n=Math.abs(Math.sin((x+camera.x)*.12)*Math.cos((y+camera.y)*.13));
   ctx.fillStyle=n>.82?'#418052':'#37764b';
   ctx.fillRect(x,y,2,2);
  }
 }
 // Dere: adanın doğusunda
 ctx.fillStyle='#237f9b';
 ctx.beginPath();
 ctx.moveTo(W*.82,0);ctx.bezierCurveTo(W*.68,H*.3,W*.93,H*.5,W*.78,H);
 ctx.lineTo(W*.91,H);ctx.bezierCurveTo(W*1.02,H*.5,W*.79,H*.35,W*.92,0);
 ctx.closePath();ctx.fill();
 ctx.strokeStyle='#5bd2d7';ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(W*.87,0);ctx.bezierCurveTo(W*.76,H*.3,W*.96,H*.55,W*.85,H);ctx.stroke();
 // Köprü
 ctx.fillStyle='#6f4a2c';ctx.fillRect(W*.78,H*.54,90,18);
 for(let i=0;i<6;i++){ctx.fillStyle='#98643a';ctx.fillRect(W*.78+i*15,H*.54,12,18)}
 // Dünya nesneleri
 for(const o of world){
  const x=screenX(o.x),y=screenY(o.y);
  if(x<-60||x>W+60||y<-60||y>H+60)continue;
  if(o.type==='tree')drawTree(x,y);
  if(o.type==='rock')drawRock(x,y);
  if(o.type==='berry')drawBerry(x,y);
 }
 // Evler
 for(const b of buildings){
  drawCabin(screenX(b.x),screenY(b.y));
 }
 // Başlangıç kamp ateşi
 const fx=screenX(-45),fy=screenY(-42);
 circle(fx,fy,19,'#68412a');
 circle(fx,fy,12,'#ff7a31');
 circle(fx,fy,6,'#ffe58b');
 // Karakter
 drawPlayer();
 // Küçük yön pusulası
 ctx.fillStyle='#f5ffda';ctx.font='bold 12px Arial';
 ctx.fillText('N ↑',W-45,105);
}

function gather(){
 let nearest=null,md=70;
 for(const o of world){
  const d=Math.hypot(o.x-player.x,o.y-player.y);
  if(d<md){nearest=o;md=d}
 }
 if(!nearest){toast('Burada toplanacak kaynak yok!');return}
 if(nearest.type==='tree'){
  wood+=nearest.amount;toast('🪵 '+nearest.amount+' odun topladın!');
 }else if(nearest.type==='rock'){
  stone+=nearest.amount;toast('🪨 '+nearest.amount+' taş topladın!');
 }else{
  berry+=nearest.amount;toast('🫐 '+nearest.amount+' meyve topladın!');
 }
 burst(nearest.x,nearest.y,'#d8ffc4');
 world=world.filter(o=>o!==nearest);
 updateUI();
}
function eat(){
 if(berry<=0){toast('Önce çalılardan meyve topla!');return}
 if(food>=100){toast('Aç değilsin!');return}
 berry--;food=Math.min(100,food+28);
 updateUI();toast('Meyve yedin. Enerjin arttı!');
}
function build(){
 if(wood<10||stone<5){
  toast('Ev için 10 odun ve 5 taş gerekiyor!');
  return;
 }
 if(buildings.some(b=>Math.hypot(b.x-player.x,b.y-player.y)<100)){
  toast('Burada zaten bir ev var!');return;
 }
 wood-=10;stone-=5;
 buildings.push({x:player.x,y:player.y});
 hp=Math.min(100,hp+10);
 updateUI();
 burst(player.x,player.y,'#ffe2a1');
 toast('🏠 Evin hazır! Başardın!');
}
$('gather').onclick=gather;
$('eat').onclick=eat;
$('build').onclick=build;

function burst(x,y,color){
 for(let i=0;i<12;i++){
  const a=Math.random()*Math.PI*2,s=rnd(25,100);
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6,color});
 }
}
function update(dt){
 elapsed+=dt;
 food=Math.max(0,food-dt*.38);
 if(food<=0)hp=Math.max(0,hp-dt*1.4);
 else if(food>65)hp=Math.min(100,hp+dt*.25);
 if(hp<=0){
  playing=false;
  $('menu').classList.remove('hidden');
  $('menu').querySelector('h1').textContent='MACERA BİTTİ';
  $('menu').querySelector('p').innerHTML='Enerjin tükendi!<br>Topladığın kaynaklar: 🪵 '+wood+' • 🪨 '+stone+'<br>Yeni bir maceraya başlayabilirsin.';
  $('start').textContent='YENİ OYUN ↻';
  ['joystick','actions','hint'].forEach(id=>$(id).classList.add('hidden'));
  return;
 }
 let dx=joystick.x,dy=joystick.y;
 if(keys.ArrowLeft||keys.a)dx--;
 if(keys.ArrowRight||keys.d)dx++;
 if(keys.ArrowUp||keys.w)dy--;
 if(keys.ArrowDown||keys.s)dy++;
 const m=Math.hypot(dx,dy);
 if(m>0){dx/=m;dy/=m}
 player.x+=dx*player.speed*dt;
 player.y+=dy*player.speed*dt;
 camera.x+=(player.x-camera.x)*Math.min(1,dt*5);
 camera.y+=(player.y-camera.y)*Math.min(1,dt*5);
 for(const p of particles){
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
 }
 particles=particles.filter(p=>p.life>0);
 if(messageTimer>0){messageTimer-=dt;if(messageTimer<=0)$('toast').style.display='none'}
 updateUI();
}
function loop(t){
 const dt=Math.min((t-last)/1000||0,.04);last=t;
 if(playing)update(dt);
 draw();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

addEventListener('keydown',e=>{
 keys[e.key]=true;
 if(e.key.toLowerCase()==='e')gather();
 if(e.key.toLowerCase()==='b')build();
 if(e.key.toLowerCase()==='f')eat();
});
addEventListener('keyup',e=>keys[e.key]=false);

// Dokunmatik hareket çubuğu
const stick=$('joystick'),knob=$('knob');
stick.addEventListener('pointerdown',e=>{
 joyTouch=e.pointerId;stick.setPointerCapture(e.pointerId);moveJoy(e);
});
stick.addEventListener('pointermove',e=>{
 if(e.pointerId===joyTouch)moveJoy(e);
});
function moveJoy(e){
 const r=stick.getBoundingClientRect();
 const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
 const m=Math.hypot(dx,dy),max=39;
 const scale=m>max?max/m:1;
 const x=dx*scale,y=dy*scale;
 knob.style.left=(39+x)+'px';knob.style.top=(39+y)+'px';
 joystick.x=x/max;joystick.y=y/max;
}
function releaseJoy(){
 joyTouch=null;joystick.x=0;joystick.y=0;
 knob.style.left='37px';knob.style.top='37px';
}
stick.addEventListener('pointerup',releaseJoy);
stick.addEventListener('pointercancel',releaseJoy);
})();
</script>
</body>
 </html>
